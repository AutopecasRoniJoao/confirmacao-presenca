<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Viewport ajustada para impedir zoom automático incômodo no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Ponto — Leitor de Tags | Roni</title>

  <!-- Ícone da Aba do Navegador (Favicon) -->
<link rel="icon" type="image/x-icon" href="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg">
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <link rel="apple-touch-icon" href="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg">

  <style>
    :root {
      --primary: #0056b3;
      --primary-hover: #004085;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #e9ecef;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; /* Remove o brilho azul feio ao tocar no celular */
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header img { max-height: 55px; width: auto; }

    .header-actions { 
      display: flex; 
      gap: 0.5rem; 
      width: auto;
    }

    .btn-header {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      min-height: 44px; /* Tamanho mínimo para toque no celular */
    }

    .btn-header:active { transform: scale(0.98); }
    .btn-header:hover { background-color: var(--primary); color: white; }
    .btn-admin { background-color: var(--primary); color: white; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .event-banner {
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid #bae6fd;
      text-align: center;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
      text-align: center;
    }

    .card h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .card p { font-size: 0.9rem; color: #64748b; margin-bottom: 1.2rem; }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem; /* Tamanho 16px+ evita auto-zoom no iOS */
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      margin-bottom: 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      min-height: 48px;
    }

    .btn-primary:active { background-color: var(--primary-hover); }

    #status-msg {
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
    }

    #status-msg.sucesso { display: block; background-color: #d1fae5; color: #065f46; }
    #status-msg.erro { display: block; background-color: #fee2e2; color: #991b1b; }
    #status-msg.alerta { display: block; background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

    .presence-container {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
    }

    .presence-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
    }

    .presence-header h3 { font-size: 1.1rem; }

    .badge {
      background-color: var(--primary);
      color: white;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .presence-list { list-style: none; max-height: 380px; overflow-y: auto; }

    .presence-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    .presence-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .presence-tag { font-weight: 700; color: var(--primary); font-size: 1rem; }
    .presence-sector { font-size: 0.82rem; color: #64748b; }
    .presence-time { font-size: 0.78rem; color: #94a3b8; }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .status-badge.atrasado { background-color: #fef3c7; color: #b45309; }
    .status-badge.notempo { background-color: #d1fae5; color: #047857; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: white;
      padding: 1.8rem;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      font-size: 1.5rem; cursor: pointer; color: #94a3b8;
      padding: 0.5rem;
    }

    footer { text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #94a3b8; }

    /* 📱 ADAPTAÇÕES ESPECÍFICAS PARA TELA DE CELULAR (Abaixo de 600px) */
    @media (max-width: 600px) {
      header {
        justify-content: center;
        text-align: center;
        padding: 0.8rem 1rem;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
      }

      .btn-header {
        flex: 1;
        font-size: 0.85rem;
        padding: 0.5rem;
      }

      main {
        padding: 1rem 0.75rem;
      }

      .card {
        padding: 1.25rem 1rem;
      }

      .card h2 { font-size: 1.2rem; }

      .presence-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.5rem;
      }

      .presence-item > div:last-child {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg" alt="Logo Roni">
    <div class="header-actions">
      <button class="btn-header" onclick="toggleFullScreen()">⛶ Tela Cheia</button>
      <button class="btn-header btn-admin" onclick="abrirModalAdmin()">🔐 Admin</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div id="active-event-container" style="display: none;">
        <div class="event-banner" id="event-banner-text">Evento: --</div>
      </div>

      <h2>Aproxime a sua Tag</h2>
      <p>O leitor registrará automaticamente sem a necessidade de clicar na tela.</p>

      <form id="presence-form">
        <input 
          type="text" 
          id="tag-input" 
          placeholder="Aproxime o leitor aqui..." 
          autofocus 
          required 
          autocomplete="off"
          enterkeyhint="done"
        />
        <button type="submit" class="btn-primary">Confirmar Presença</button>
      </form>

      <div id="status-msg"></div>
    </div>

    <div class="presence-container">
      <div class="presence-header">
        <h3>Confirmados Recentemente</h3>
        <span class="badge" id="counter">0</span>
      </div>

      <ul class="presence-list" id="presence-list">
        <li style="text-align:center; color:#6c757d; padding:1rem;">Nenhum registro até o momento.</li>
      </ul>
    </div>
  </main>

  <div class="modal-overlay" id="modal-login">
    <div class="modal-card">
      <button class="modal-close" onclick="fecharModalAdmin()">&times;</button>
      <h3 style="margin-bottom: 1.2rem;">Acesso Administrativo</h3>
      <form id="modal-login-form">
        <input type="text" id="modal-user" placeholder="Usuário" required />
        <input type="password" id="modal-pass" placeholder="Senha" required />
        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>
    </div>
  </div>

  <footer>
    &copy; Confirmação de Presença — Roni
  </footer>

  <script>
    let eventos = [];
    let funcionarios = [];
    let eventoAtivoId = null;

    const presenceList = document.getElementById('presence-list');
    const counter = document.getElementById('counter');
    const statusMsg = document.getElementById('status-msg');
    const tagInput = document.getElementById('tag-input');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function tocarSom(tipo) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (tipo === 'sucesso') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } else {
        const playBeep = (delay) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, audioCtx.currentTime + delay);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + 0.12);
        };
        playBeep(0);
        playBeep(0.15);
      }
    }

    init();

    function init() {
      carregarDados();
      renderizarPresencas();
      manterFocoNoInput();

      window.addEventListener('storage', () => {
        carregarDados();
        renderizarPresencas();
      });
    }

    function carregarDados() {
      eventos = JSON.parse(localStorage.getItem('eventos_roni')) || [];
      funcionarios = JSON.parse(localStorage.getItem('funcionarios_roni')) || [];
      eventoAtivoId = localStorage.getItem('evento_ativo_roni') || null;

      if (eventos.length === 0) {
        const evtInicial = {
          id: 'evt_' + Date.now(),
          nome: 'Evento Principal',
          data: getFormattedDateOnly(),
          horaInicio: '08:00',
          registros: []
        };
        eventos.push(evtInicial);
        eventoAtivoId = evtInicial.id;
        salvarTudo();
      } else if (!eventoAtivoId || !eventos.find(e => e.id === eventoAtivoId)) {
        eventoAtivoId = eventos[0].id;
      }

      const atual = eventos.find(e => e.id === eventoAtivoId);
      if (atual) {
        document.getElementById('active-event-container').style.display = 'block';
        document.getElementById('event-banner-text').textContent = `Evento: ${atual.nome} (${atual.data} às ${atual.horaInicio || '00:00'})`;
      }
    }

    function manterFocoNoInput() {
      tagInput.focus();
      document.addEventListener('click', (e) => {
        if (!document.getElementById('modal-login').contains(e.target)) {
          tagInput.focus();
        }
      });
    }

    function salvarTudo() {
      localStorage.setItem('eventos_roni', JSON.stringify(eventos));
      localStorage.setItem('funcionarios_roni', JSON.stringify(funcionarios));
      localStorage.setItem('evento_ativo_roni', eventoAtivoId);
    }

    function getFormattedDateOnly() {
      return new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
    }

    function getBrasiliaTimeOnly() {
      return new Date().toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById('presence-form').onsubmit = (e) => {
      e.preventDefault();
      carregarDados();
      const tag = tagInput.value.trim();
      if (!tag) return;

      const evtAtual = eventos.find(e => e.id === eventoAtivoId);
      if (!evtAtual) return;

      const jaRegistrado = evtAtual.registros.find(r => r.tag.toLowerCase() === tag.toLowerCase());
      if (jaRegistrado) {
        tocarSom('alerta');
        exibirMensagem(`⚠️ ATENÇÃO: Presença de "${jaRegistrado.nome}" já registrada neste evento!`, 'alerta');
        tagInput.value = '';
        tagInput.focus();
        return;
      }

      const func = funcionarios.find(f => f.tag.toLowerCase() === tag.toLowerCase());
      const nomeExibicao = func ? func.nome : tag;
      const setorExibicao = func ? func.setor : 'Geral';

      const horaAtual = getBrasiliaTimeOnly();
      let atrasado = false;
      if (evtAtual.horaInicio) {
        atrasado = horaAtual > evtAtual.horaInicio;
      }

      const novoRegistro = {
        id: 'pausa_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
        tag: tag,
        nome: nomeExibicao,
        setor: setorExibicao,
        hora: horaAtual,
        atrasado: atrasado,
        isoStart: new Date().toISOString()
      };

      evtAtual.registros.unshift(novoRegistro);
      salvarTudo();
      renderizarPresencas();

      if (atrasado) {
        tocarSom('alerta');
        exibirMensagem(`✓ Presença confirmada: ${nomeExibicao} (Atrasado)`, 'erro');
      } else {
        tocarSom('sucesso');
        exibirMensagem(`✓ Presença confirmada: ${nomeExibicao}`, 'sucesso');
      }

      tagInput.value = '';
      tagInput.focus();
    };

    function renderizarPresencas() {
      presenceList.innerHTML = '';
      const evtAtual = eventos.find(e => e.id === eventoAtivoId);

      if (!evtAtual || evtAtual.registros.length === 0) {
        presenceList.innerHTML = '<li style="text-align:center; color:#6c757d; padding:1rem;">Nenhum registro até o momento.</li>';
        counter.textContent = '0';
        return;
      }

      counter.textContent = evtAtual.registros.length;

      evtAtual.registros.forEach(reg => {
        const li = document.createElement('li');
        li.className = 'presence-item';
        li.innerHTML = `
          <div class="presence-info">
            <span class="presence-tag">${reg.nome}</span>
            <span class="presence-sector">Setor: ${reg.setor || 'Geral'} | RFID: ${reg.tag}</span>
            <span class="presence-time">${reg.hora}</span>
          </div>
          <div>
            <span class="status-badge ${reg.atrasado ? 'atrasado' : 'notempo'}">
              ${reg.atrasado ? '⚠️ Atrasado' : '✓ No tempo'}
            </span>
          </div>
        `;
        presenceList.appendChild(li);
      });
    }

    function exibirMensagem(txt, tipo) {
      statusMsg.textContent = txt;
      statusMsg.className = tipo;
      setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function abrirModalAdmin() {
      document.getElementById('modal-login').style.display = 'flex';
      document.getElementById('modal-user').focus();
    }

    function fecharModalAdmin() {
      document.getElementById('modal-login').style.display = 'none';
      tagInput.focus();
    }

    document.getElementById('modal-login-form').onsubmit = (e) => {
      e.preventDefault();
      const user = document.getElementById('modal-user').value;
      const pass = document.getElementById('modal-pass').value;

      if (user === 'admin' && pass === 'roni1515') {
        window.location.href = 'admin.html';
      } else {
        alert('Usuário ou senha incorretos!');
      }
    };

    // Registro PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker ativo!'))
          .catch(err => console.log('Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>
