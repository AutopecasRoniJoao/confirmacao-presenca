<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Presença | Roni</title>
  
  <link rel="icon" type="image/x-icon" href="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">

  <style>
    :root {
      --primary: #0056b3;
      --primary-hover: #004085;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header img { max-height: 50px; width: auto; }

    .btn-admin {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
    }

    main {
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--primary);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.5rem;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    select, input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.2rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    .backup-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-secondary {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-size: 0.85rem;
    }

    .list-presencas {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .item-presenca {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .status-badge.notempo { background: #d1fae5; color: #047857; }
    .status-badge.atrasado { background: #fef3c7; color: #b45309; }
  </style>
</head>
<body>

  <header>
    <img src="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg" alt="Logo Roni">
    <a href="painel.html" class="btn-admin">⚙️ Painel Admin</a>
  </header>

  <main>
    <!-- TELA DE CHAMADA DA PRESENÇA -->
    <div class="card">
      <h2>📌 Registrar Presença</h2>

      <label for="select-evento">Selecione o Evento Ativo:</label>
      <select id="select-evento" onchange="atualizarListaRecentes()"></select>

      <form onsubmit="registrarPresencaManual(event)">
        <label for="tag-rfid">Tag RFID / Digitar Código:</label>
        <input type="text" id="tag-rfid" placeholder="Aproxime o cartão ou digite o código..." autofocus required />
        <button type="submit" class="btn-primary">Confirmar Presença</button>
      </form>
    </div>

    <!-- LISTA DE PRESENÇAS REGISTRADAS -->
    <div class="card">
      <h2>📋 Útimas Presenças Registradas</h2>
      <ul id="lista-recentes" class="list-presencas">
        <li style="text-align: center; color: #64748b; padding: 1rem;">Nenhum registro no evento selecionado.</li>
      </ul>

      <div class="backup-actions">
        <button class="btn-secondary" onclick="exportarBackupJSON()">📥 Exportar Backup</button>
        <button class="btn-secondary" onclick="document.getElementById('input-file-backup').click()">📤 Importar Backup</button>
        <input type="file" id="input-file-backup" accept=".json" style="display:none;" onchange="importarBackupJSON(event)">
      </div>
    </div>
  </main>

  <script>
    let eventos = [];
    let funcionarios = [];

    document.addEventListener('DOMContentLoaded', () => {
      carregarDados();
      renderizarEventos();
      
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Erro:', err));
      }
    });

    function carregarDados() {
      eventos = JSON.parse(localStorage.getItem('eventos_roni')) || [];
      funcionarios = JSON.parse(localStorage.getItem('funcionarios_roni')) || [];
    }

    function salvarTudo() {
      localStorage.setItem('eventos_roni', JSON.stringify(eventos));
      localStorage.setItem('funcionarios_roni', JSON.stringify(funcionarios));
    }

    function renderizarEventos() {
      const select = document.getElementById('select-evento');
      select.innerHTML = '';

      if (eventos.length === 0) {
        select.innerHTML = '<option value="">Nenhum evento ativo cadastrado</option>';
        return;
      }

      eventos.forEach(evt => {
        const opt = document.createElement('option');
        opt.value = evt.id;
        opt.textContent = `${evt.nome} (${evt.data})`;
        select.appendChild(opt);
      });

      atualizarListaRecentes();
    }

    function registrarPresencaManual(e) {
      e.preventDefault();
      const evtId = document.getElementById('select-evento').value;
      const tagInput = document.getElementById('tag-rfid');
      const tagValor = tagInput.value.trim();

      if (!evtId) {
        alert('Selecione ou crie um evento no painel admin primeiro!');
        return;
      }

      const func = funcionarios.find(f => f.tag === tagValor);
      if (!func) {
        alert('❌ Tag ou colaborador não cadastrado no sistema!');
        tagInput.value = '';
        return;
      }

      const evt = eventos.find(e => e.id === evtId);
      if (!evt.registros) evt.registros = [];

      if (evt.registros.some(r => r.tag === tagValor)) {
        alert(`⚠️ ${func.nome} já registrou presença neste evento!`);
        tagInput.value = '';
        return;
      }

      const agora = new Date();
      const horaAtual = agora.toTimeString().slice(0, 5);
      const atrasado = evt.horaInicio ? horaAtual > evt.horaInicio : false;

      evt.registros.push({
        id: 'reg_' + Date.now(),
        nome: func.nome,
        setor: func.setor,
        tag: func.tag,
        hora: horaAtual,
        atrasado: atrasado
      });

      salvarTudo();
      tagInput.value = '';
      atualizarListaRecentes();
      alert(`✓ Presença confirmada: ${func.nome}`);
    }

    function atualizarListaRecentes() {
      const evtId = document.getElementById('select-evento').value;
      const lista = document.getElementById('lista-recentes');
      lista.innerHTML = '';

      const evt = eventos.find(e => e.id === evtId);
      if (!evt || !evt.registros || evt.registros.length === 0) {
        lista.innerHTML = '<li style="text-align: center; color: #64748b; padding: 1rem;">Nenhum registro no evento selecionado.</li>';
        return;
      }

      [...evt.registros].reverse().forEach(reg => {
        const li = document.createElement('li');
        li.className = 'item-presenca';
        li.innerHTML = `
          <div>
            <strong>${reg.nome}</strong> <br>
            <small style="color: #64748b;">${reg.setor} | ⏰ ${reg.hora}</small>
          </div>
          <span class="status-badge ${reg.atrasado ? 'atrasado' : 'notempo'}">
            ${reg.atrasado ? 'Atrasado' : 'No Tempo'}
          </span>
        `;
        lista.appendChild(li);
      });
    }

    function exportarBackupJSON() {
      const dados = {
        eventos: JSON.parse(localStorage.getItem('eventos_roni')) || [],
        funcionarios: JSON.parse(localStorage.getItem('funcionarios_roni')) || []
      };

      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_roni_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importarBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const dados = JSON.parse(evt.target.result);
          if (dados.eventos && dados.funcionarios) {
            localStorage.setItem('eventos_roni', JSON.stringify(dados.eventos));
            localStorage.setItem('funcionarios_roni', JSON.stringify(dados.funcionarios));
            alert('✓ Backup restaurado com sucesso!');
            location.reload();
          } else {
            alert('Formato do arquivo de backup inválido.');
          }
        } catch (err) {
          alert('Erro ao ler o arquivo de backup.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
