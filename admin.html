<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Admin — Gestão de Presença | Roni</title>
  
  <link rel="icon" type="image/x-icon" href="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg">
  <meta name="theme-color" content="#0056b3">

  <style>
    :root {
      --primary: #0056b3;
      --primary-hover: #004085;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #e9ecef;
      --danger: #dc3545;
      --success: #28a745;
      --warning: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header img { max-height: 50px; width: auto; }

    .btn-voltar {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-voltar:hover { background-color: var(--primary); color: white; }

    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      width: 100%;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
    select, input[type="text"], input[type="time"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--primary); }

    .list-registros {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 500px;
      overflow-y: auto;
    }

    .item-registro {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .info-reg { display: flex; flex-direction: column; gap: 0.2rem; }
    .nome-reg { font-weight: 700; color: #1e293b; font-size: 1rem; }
    .detalhes-reg { font-size: 0.85rem; color: #64748b; }

    .badge-status {
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-status.atrasado { background-color: #fef3c7; color: #b45309; }
    .badge-status.notempo { background-color: #d1fae5; color: #047857; }

    .acoes-reg {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-edit {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-edit:hover { background-color: #0369a1; }

    .btn-del {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-del:hover { background-color: #b91c1c; }

    /* Caixa de edição inline */
    .edit-box {
      width: 100%;
      background-color: #e0f2fe;
      border: 1px solid #7dd3fc;
      padding: 0.75rem;
      border-radius: 8px;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .edit-box input[type="time"] {
      margin-bottom: 0;
      padding: 0.4rem;
      width: auto;
    }

    .btn-save-edit {
      background-color: var(--success);
      color: white;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel-edit {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    footer { text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <img src="https://roni.com.br/wp-content/uploads/2023/02/Logomarca-RONI-oficial.jpg" alt="Logo Roni">
    <a href="index.html" class="btn-voltar">← Voltar para Chamada</a>
  </header>

  <main>
    <div class="card">
      <h2>📋 Presença do Evento</h2>
      
      <label for="select-evento-admin">Selecione o Evento:</label>
      <select id="select-evento-admin" onchange="carregarPresencasEvento(this.value)"></select>

      <ul class="list-registros" id="lista-presencas">
        <li style="text-align: center; color: #64748b; padding: 1rem;">Selecione um evento para visualizar as presenças.</li>
      </ul>
    </div>
  </main>

  <footer>&copy; Painel Administrativo — Roni</footer>

  <script>
    let eventos = [];
    let idEdicaoAtual = null;

    init();

    function init() {
      carregarDados();
      renderizarSelectEventos();
    }

    function carregarDados() {
      eventos = JSON.parse(localStorage.getItem('eventos_roni')) || [];
    }

    function salvarTudo() {
      localStorage.setItem('eventos_roni', JSON.stringify(eventos));
    }

    function renderizarSelectEventos() {
      const select = document.getElementById('select-evento-admin');
      select.innerHTML = '';

      if (eventos.length === 0) {
        select.innerHTML = '<option value="">Nenhum evento cadastrado</option>';
        return;
      }

      eventos.forEach(evt => {
        const opt = document.createElement('option');
        opt.value = evt.id;
        opt.textContent = `${evt.nome} (${evt.data} às ${evt.horaInicio || '00:00'})`;
        select.appendChild(opt);
      });

      // Carrega o primeiro evento por padrão
      carregarPresencasEvento(eventos[0].id);
    }

    function carregarPresencasEvento(eventoId) {
      idEdicaoAtual = null;
      const lista = document.getElementById('lista-presencas');
      lista.innerHTML = '';

      const evt = eventos.find(e => e.id === eventoId);
      if (!evt || !evt.registros || evt.registros.length === 0) {
        lista.innerHTML = '<li style="text-align: center; color: #64748b; padding: 1rem;">Nenhuma presença registrada neste evento.</li>';
        return;
      }

      evt.registros.forEach(reg => {
        const li = document.createElement('li');
        li.className = 'item-registro';
        li.id = `reg-${reg.id}`;

        li.innerHTML = `
          <div class="info-reg">
            <span class="nome-reg">${reg.nome}</span>
            <span class="detalhes-reg">Setor: ${reg.setor || 'Geral'} | Tag RFID: ${reg.tag}</span>
            <span class="detalhes-reg">⏰ Horário: <strong>${reg.hora}</strong> 
              <span class="badge-status ${reg.atrasado ? 'atrasado' : 'notempo'}">
                ${reg.atrasado ? '⚠️ Atrasado' : '✓ No tempo'}
              </span>
            </span>
          </div>
          <div class="acoes-reg">
            <button class="btn-edit" onclick="abrirEdicaoHorario('${evt.id}', '${reg.id}', '${reg.hora}')">✏️ Editar Horário</button>
            <button class="btn-del" onclick="removerRegistro('${evt.id}', '${reg.id}')">🗑️ Remover</button>
          </div>
          <div id="box-edit-${reg.id}" style="display: none; width: 100%;"></div>
        `;

        lista.appendChild(li);
      });
    }

    // ✏️ ABRIR FORMULÁRIO DE EDIÇÃO DE HORÁRIO INLINE
    function abrirEdicaoHorario(eventoId, registroId, horaAtual) {
      // Se já houver outro em edição, fecha
      if (idEdicaoAtual && idEdicaoAtual !== registroId) {
        cancelarEdicao(idEdicaoAtual);
      }

      idEdicaoAtual = registroId;
      const box = document.getElementById(`box-edit-${registroId}`);
      box.style.display = 'block';

      box.innerHTML = `
        <div class="edit-box">
          <label style="margin:0; font-size:0.85rem;">Novo Horário:</label>
          <input type="time" id="input-hora-${registroId}" value="${horaAtual}" required />
          <button class="btn-save-edit" onclick="salvarNovoHorario('${eventoId}', '${registroId}')">Salvar</button>
          <button class="btn-cancel-edit" onclick="cancelarEdicao('${registroId}')">Cancelar</button>
        </div>
      `;
    }

    function cancelarEdicao(registroId) {
      const box = document.getElementById(`box-edit-${registroId}`);
      if (box) {
        box.style.display = 'none';
        box.innerHTML = '';
      }
      idEdicaoAtual = null;
    }

    // 💾 SALVAR HORÁRIO ALTERADO E RECALCULAR ATRASO
    function salvarNovoHorario(eventoId, registroId) {
      const novahora = document.getElementById(`input-hora-${registroId}`).value;
      if (!novahora) return;

      const evt = eventos.find(e => e.id === eventoId);
      if (!evt) return;

      const reg = evt.registros.find(r => r.id === registroId);
      if (!reg) return;

      // Atualiza a hora
      reg.hora = novahora;

      // Recalcula se o funcionário ficou atrasado de acordo com o horário do evento
      if (evt.horaInicio) {
        reg.atrasado = novahora > evt.horaInicio;
      } else {
        reg.atrasado = false;
      }

      salvarTudo();
      carregarPresencasEvento(eventoId);
    }

    // 🗑️ REMOVER REGISTRO DE PRESENÇA
    function removerRegistro(eventoId, registroId) {
      if (!confirm('Tem certeza que deseja remover esta presença?')) return;

      const evt = eventos.find(e => e.id === eventoId);
      if (!evt) return;

      evt.registros = evt.registros.filter(r => r.id !== registroId);
      salvarTudo();
      carregarPresencasEvento(eventoId);
    }
  </script>
</body>
</html>
