<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Certificados</title>
    
    <!-- CDNs das bibliotecas (jsPDF, AutoTable, FontAwesome e jsSHA) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha256.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Modal de Autenticação Over */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-size: 1.25rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .input-group input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Interface do Painel */
        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card h3 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-card p {
            font-size: 0.875rem;
            color: #64748b;
        }

        .stat-card h4 {
            font-size: 1.5rem;
            color: var(--text);
            margin-top: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            font-size: 0.875rem;
            color: #64748b;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
        }

        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }
    </style>
</head>
<body>

    <!-- Overlay de Login -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Autenticação Requerida</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="admin-pass">Senha de Administrador</label>
                    <input type="password" id="admin-pass" required autofocus autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Acessar Painel</button>
                <div id="login-error" class="error-msg">Senha incorreta. Tente novamente.</div>
            </form>
        </div>
    </div>

    <!-- Conteúdo Principal do Painel -->
    <header>
        <h1>Painel Administrativo - Emissão de Certificados</h1>
        <button id="logout-btn" class="btn-small btn-danger">Sair</button>
    </header>

    <div class="main-container">
        <div class="panel-grid">
            
            <div class="card">
                <h3>Selecione o Evento</h3>
                <div class="input-group">
                    <select id="event-select">
                        <option value="">Carregando eventos...</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h3>Métricas do Evento</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <p>Total de Credenciados</p>
                        <h4 id="stat-total">0</h4>
                    </div>
                    <div class="stat-card">
                        <p>Certificados Gerados</p>
                        <h4 id="stat-gerados">0</h4>
                    </div>
                </div>
                <button id="export-pdf-btn" class="btn" style="width: auto;">
                    <i class="fa-solid fa-file-pdf"></i> Exportar Relatório em PDF
                </button>
            </div>

            <div class="card">
                <h3>Lista de Participantes</h3>
                <div style="overflow-x: auto;">
                    <table id="participants-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="participants-list">
                            <tr>
                                <td colspan="5" style="text-align: center;">Selecione um evento acima.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Configurações
        const HASH_SENHA_ADMIN = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918'; // SHA-256 para 'admin'

        // Função de hash síncrona via biblioteca jsSHA
        function gerarHashSHA256(texto) {
            const shaObj = new jsSHA("SHA-256", "TEXT");
            shaObj.update(texto);
            return shaObj.getHash("HEX");
        }

        // Inicialização e Autenticação
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();

            document.getElementById('login-form').addEventListener('submit', autenticarAdmin);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('event-select').addEventListener('change', carregarDadosEvento);
            document.getElementById('export-pdf-btn').addEventListener('click', exportarRelatorioPDF);
        });

        function checkAuth() {
            const isAuth = sessionStorage.getItem('admin_autenticado');
            if (isAuth === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                carregarEventosSelect();
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        }

        function autenticarAdmin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value.trim();
            const errorMsg = document.getElementById('login-error');

            const hashInput = gerarHashSHA256(pass);

            if (hashInput === HASH_SENHA_ADMIN) {
                sessionStorage.setItem('admin_autenticado', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                errorMsg.style.display = 'none';
                document.getElementById('admin-pass').value = '';
                carregarEventosSelect();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('admin-pass').value = '';
                document.getElementById('admin-pass').focus();
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_autenticado');
            location.reload();
        }

        // Carregamento de Eventos e Participantes
        function carregarEventosSelect() {
            const select = document.getElementById('event-select');
            const eventos = JSON.parse(localStorage.getItem('eventos_roni')) || [];

            select.innerHTML = '<option value="">-- Selecione um Evento --</option>';

            if (eventos.length === 0) {
                select.innerHTML = '<option value="">Nenhum evento cadastrado no sistema</option>';
                return;
            }

            eventos.forEach(evt => {
                const opt = document.createElement('option');
                opt.value = evt.id;
                opt.textContent = `${evt.nome} (${evt.data})`;
                select.appendChild(opt);
            });
        }

        function carregarDadosEvento() {
            const eventId = document.getElementById('event-select').value;
            const tbody = document.getElementById('participants-list');
            
            if (!eventId) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Selecione um evento acima.</td></tr>';
                document.getElementById('stat-total').textContent = '0';
                document.getElementById('stat-gerados').textContent = '0';
                return;
            }

            const chaveParticipantes = `participantes_${eventId}`;
            const participantes = JSON.parse(localStorage.getItem(chaveParticipantes)) || [];

            // Atualiza métricas
            document.getElementById('stat-total').textContent = participantes.length;
            const gerados = participantes.filter(p => p.certificadoGerado).length;
            document.getElementById('stat-gerados').textContent = gerados;

            // Renderiza tabela
            tbody.innerHTML = '';
            if (participantes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum participante inscrito neste evento.</td></tr>';
                return;
            }

            participantes.forEach((p, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.nome}</td>
                    <td>${p.cpf}</td>
                    <td>${p.email}</td>
                    <td>${p.certificadoGerado ? 'Gerado' : 'Pendente'}</td>
                    <td class="actions-cell">
                        <button class="btn-small" onclick="alternarStatus(${eventId}, ${idx})">
                            ${p.certificadoGerado ? 'Marcar Pendente' : 'Marcar Gerado'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function alternarStatus(eventId, index) {
            const chaveParticipantes = `participantes_${eventId}`;
            let participantes = JSON.parse(localStorage.getItem(chaveParticipantes)) || [];
            
            if (participantes[index]) {
                participantes[index].certificadoGerado = !participantes[index].certificadoGerado;
                localStorage.setItem(chaveParticipantes, JSON.stringify(participantes));
                carregarDadosEvento();
            }
        }

        // Exportação de Relatório PDF
        function exportarRelatorioPDF() {
            const eventId = document.getElementById('event-select').value;
            if (!eventId) {
                alert('Selecione um evento primeiro!');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const eventos = JSON.parse(localStorage.getItem('eventos_roni')) || [];
            const eventoObj = eventos.find(e => e.id == eventId);
            const participantes = JSON.parse(localStorage.getItem(`participantes_${eventId}`)) || [];

            doc.setFontSize(16);
            doc.text(`Relatório de Participantes - ${eventoObj ? eventoObj.nome : 'Evento'}`, 14, 20);
            
            doc.setFontSize(10);
            doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, 14, 28);

            const tableRows = participantes.map(p => [
                p.nome,
                p.cpf,
                p.email,
                p.certificadoGerado ? 'Sim' : 'Não'
            ]);

            doc.autoTable({
                head: [['Nome', 'CPF', 'Email', 'Certificado Emitido']],
                body: tableRows,
                startY: 35,
            });

            doc.save(`relatorio_evento_${eventId}.pdf`);
        }
    </script>
</body>
</html>
